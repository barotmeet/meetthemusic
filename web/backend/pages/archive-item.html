        </a>
        <div class="header-actions">
          <button class="icon-btn" id="theme-toggle" aria-label="Toggle colour theme"></button>
          <a class="btn-primary" href="/learn">Start learning</a>
          <div class="nav-account" id="account-links"></div>
          <button class="icon-btn" id="mobile-toggle" aria-label="Open menu"></button>

        <div class="container">
          <nav class="nav-links" aria-label="Main navigation">

        </div>

    <div class="mobile-menu" id="mobile-menu" aria-hidden="true">

  <main>
    <article id="detail-root">
      <p class="loading">Loading</p>
    </article>
  </main>

    <div class="footer-inner">
      <p class="copyright">� 2026 ClassicalVerse � Preserving sound, sharing knowledge.</p>
    </div>
  </footer>
  <script src="/js/themes.js"></script><script src="/js/ui.js"></script><script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (function () {
      const slug = new URLSearchParams(location.search).get('slug');
      if (!slug) { document.getElementById('detail-root').innerHTML = '<p class="loading">Missing slug.</p>'; return; }
      const u = new URL(location.href);
      u.searchParams.set('type', 'archives');
      u.searchParams.set('slug', slug);
      history.replaceState({}, '', u.pathname + '?' + u.searchParams.toString());
      loadDetail();
    })();
  </script>

<!-- Floating Contribute Button -->
<a class="fab-contribute" href="/submit.html" aria-label="Contribute" title="Contribute to ClassicalVerse">
  <span class="fab-icon" aria-hidden="true">+</span>

</a>
<script src="/js/themes.js"></script><script src="/js/ui.js"></script><script src="/js/app.js" defer></script>
